<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weazel News</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --red:#d3161e; --red-dark:#8E0A10; --on-red:#fff;
  --bg:#0b0b0e; --surface:#121217; --surface2:#17171d; --fg:#f4f4f6; --muted:#9a9aa6; --line:#24242c;
  --free:#3f9b4f; --busy:#c0392b;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="light"]{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efeeea; --fg:#15151a; --muted:#62626e; --line:#e1e0db;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:.6875rem}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* progress */
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--red);z-index:100}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:66px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;border:0;background:none}
.logo b{font-style:italic;font-weight:800;font-size:1.75rem;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.logo i{font-style:italic;font-weight:800;font-size:1.3rem;text-transform:uppercase;background:var(--red);color:#fff;padding:3px 9px;line-height:1.1;transform:skew(-8deg)}
nav.main{display:flex;gap:28px;align-items:center}
.nl{background:none;border:0;padding:22px 0;font-size:.9375rem;color:var(--muted);position:relative;font-weight:500}
.nl:hover{color:var(--fg)}
.nl[aria-current="page"]{color:var(--fg)}
.nl[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--red)}
.right{display:flex;align-items:center;gap:12px}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:border-color .2s}
.ibtn:hover{border-color:var(--muted)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cta{background:var(--red);color:#fff;border:0;padding:12px 22px;font-weight:600;font-size:.9375rem;display:inline-flex;gap:10px;align-items:center;text-decoration:none;transition:filter .2s,transform .2s}
.cta:hover{filter:brightness(1.12)}
.cta .d{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.burger{display:none}

/* ticker */
.ticker{display:flex;border-bottom:1px solid var(--line);background:var(--surface);overflow:hidden}
.tl{flex:none;background:var(--red);color:#fff;padding:11px 20px;font-family:var(--mono);font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.tl::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.tv{flex:1;overflow:hidden;min-width:0}
.tt{display:flex;width:max-content;animation:marq 50s linear infinite}
.ticker:hover .tt{animation-play-state:paused}
.ti{white-space:nowrap;padding:11px 0 11px 36px;font-size:.875rem;color:var(--muted);display:inline-flex;gap:36px;align-items:center}
.ti::after{content:"◆";font-size:.5rem;color:var(--red)}
@keyframes marq{to{transform:translateX(-50%)}}
.dl{flex:none;display:flex;align-items:center;padding:0 24px;color:var(--muted);border-left:1px solid var(--line)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1.25fr;min-height:480px;border-bottom:1px solid var(--line)}
.hero-t{padding:64px 32px 48px max(24px,calc((100vw - 1240px)/2 + 24px));display:flex;flex-direction:column;justify-content:center;gap:24px}
.eyebrow{color:var(--muted);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
.hero h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.04;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.hero p.l{font-size:1.2rem;color:var(--muted);max-width:44ch}
.hero-btns{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.ghost{background:none;border:0;border-bottom:1px solid var(--fg);padding:6px 0;font-weight:500}
.ghost:hover{color:var(--red);border-color:var(--red)}
.tags{display:flex;align-items:center;gap:18px;color:var(--muted);margin-top:8px}
.tags::before{content:"";width:30px;border-top:1px solid var(--muted)}
.hero-i{position:relative;overflow:hidden;min-height:340px;background:var(--surface2)}
.hero-i img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero-i::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 45%)}
.badge{position:absolute;top:22px;left:22px;z-index:2;background:var(--red);color:#fff;padding:7px 14px;font-family:var(--mono);font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.hero-cap{position:absolute;left:28px;bottom:26px;z-index:2;color:#fff}
.hero-cap b{display:block;font-size:1.4rem;font-weight:700}
.hero-cap span{opacity:.75}

/* sections */
section.s{padding:56px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sh h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sh h2::before{content:"";display:block;width:44px;height:4px;background:var(--red);margin-bottom:12px}
.sh p{color:var(--muted);margin-top:8px;max-width:60ch}
.more{background:none;border:0;border-bottom:1px solid var(--muted);padding:4px 0;color:var(--fg);font-size:.875rem}
.more:hover{color:var(--red);border-color:var(--red)}

.grid{display:grid;gap:22px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.news{background:transparent;border:0;display:flex;flex-direction:column;gap:12px;transition:transform .3s}
.news:hover{transform:translateY(-4px)}
.news .im{aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.news .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.news:hover .im img{transform:scale(1.06)}
.news .t{color:var(--red);font-family:var(--mono);font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.news h3{font-size:1.25rem;line-height:1.3;font-weight:700;transition:color .2s}
.news:hover h3{color:var(--red)}
.news p{color:var(--muted);font-size:.9375rem}

/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.split .im{aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line)}
.split .im img{width:100%;height:100%;object-fit:cover}
.split h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:16px}
.split h2::before{content:"";display:block;width:44px;height:4px;background:var(--red);margin-bottom:12px}
.split p{color:var(--muted);font-size:1.0625rem;margin-bottom:22px;white-space:pre-line}

/* service cards */
.svc{background:var(--surface);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .25s}
.svc:hover{border-color:var(--red);transform:translateY(-4px)}
.svc h3{font-size:1.25rem;font-weight:700}
.pill{display:inline-block;align-self:flex-start;font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.free{background:color-mix(in srgb,var(--free) 20%,transparent);color:var(--free)}
.pill.busy{background:color-mix(in srgb,var(--busy) 20%,transparent);color:#e0584a}

/* page hero small */
.phero{padding:64px 0 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg))}
.phero .in{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.phero h1{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:16px 0}
.phero p{color:var(--muted);font-size:1.125rem;max-width:50ch;margin-bottom:24px}
.phero .im{aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line)}
.phero .im img{width:100%;height:100%;object-fit:cover}

/* prices */
.price{background:var(--surface);border:1px solid var(--line);padding:20px}
.price h3{background:#1d1d25;color:#fff;text-align:center;text-transform:uppercase;font-size:1rem;letter-spacing:.03em;padding:14px 12px;border-bottom:3px solid var(--red);margin-bottom:8px}
.price ul{list-style:none}
.price li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--line);font-size:.9375rem;line-height:1.35}
.price li:last-child{border-bottom:0}
.price li b{color:var(--red);font-size:1.0625rem;white-space:nowrap}
.price li.note{display:block;color:var(--muted);font-size:.75rem;padding:4px 0 10px}

/* billboards */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.seg{display:inline-flex;padding:3px;background:var(--surface2);border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:8px;font-size:.875rem}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.cnt{font-family:var(--mono);font-size:.8125rem;color:var(--muted)}
.cnt b{color:var(--free);font-size:1.1rem}
.map{position:relative;border:1px solid var(--line);overflow:hidden;background:#1b1d24;user-select:none}
.map img{width:100%;height:auto;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 .6875rem var(--mono);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.5);transition:transform .2s;padding:0}
.pin.free{background:var(--free)}.pin.busy{background:var(--busy)}
.pin.free::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--free);animation:pp 2s infinite;pointer-events:none}
@keyframes pp{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.pin:hover{transform:translate(-50%,-50%) scale(1.25);z-index:3}
.pin.on{transform:translate(-50%,-50%) scale(1.45);z-index:4;box-shadow:0 0 0 4px rgba(255,255,255,.5)}
.info{margin-top:16px;display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);background:var(--surface)}
.info.hint{display:block;text-align:center;color:var(--muted);border-style:dashed}
.info .im{aspect-ratio:16/10;overflow:hidden}
.info .im img{width:100%;height:100%;object-fit:cover}
.info h3{font-size:1.25rem;margin:8px 0 4px}
.info p{color:var(--muted)}
.bb{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .2s,transform .25s}
.bb:hover{border-color:var(--red);transform:translateY(-4px)}
.bb .im{aspect-ratio:16/10;overflow:hidden}
.bb .im img{width:100%;height:100%;object-fit:cover}
.bb .bd{padding:18px;display:flex;flex-direction:column;gap:8px}
.bb h3{font-size:1.0625rem;line-height:1.35}
.bb p{color:var(--muted);font-size:.9rem}
.how{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);padding:32px}
.how h2{font-size:1.6rem;font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
.how p{color:var(--muted);font-size:1.0625rem;white-space:pre-line;max-width:70ch}

/* team */
.team{background:var(--surface);border:1px solid var(--line);padding:0 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;position:relative}
.team::before{content:"";align-self:stretch;margin:0 -24px;height:84px;background:linear-gradient(135deg,var(--red),var(--red-dark))}
.ava{width:104px;height:104px;border-radius:50%;margin-top:-52px;border:4px solid var(--surface);background:var(--surface2);display:grid;place-items:center;font-size:2rem;font-weight:700;color:var(--red);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ava img{width:100%;height:100%;object-fit:cover}
.team h3{font-size:1.25rem}
.team p{color:var(--muted);max-width:34ch}
.tel{display:flex;gap:10px;align-items:center;margin-top:6px;padding-top:14px;border-top:1px dashed var(--line);width:100%;justify-content:center}
.tel a{font-family:var(--mono);color:var(--red);text-decoration:none;font-weight:500}
.tel a:hover{text-decoration:underline}
.cbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);padding:32px}
.cbox h2{font-size:1.6rem;font-weight:800;margin-bottom:12px}
.cbox p{white-space:pre-line;color:var(--muted);font-size:1.0625rem}

/* footer */
footer{border-top:3px solid var(--red);margin-top:40px;background:var(--surface)}
.f-in{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;padding:30px 24px}
.f-in .logo b{font-size:1.3rem}.f-in .logo i{font-size:.95rem}
.f-links{display:flex;gap:22px;flex-wrap:wrap}
.f-links button{background:none;border:0;color:var(--muted);font-size:.8125rem}
.f-links button:hover{color:var(--fg)}
.f-copy{color:var(--muted);font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase}
.f-mail{color:var(--fg);font-weight:500;text-decoration:none}
.f-mail:hover{color:var(--red)}

/* totop */
#totop{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translateY(12px);transition:.25s;z-index:60}
#totop.show{opacity:1;pointer-events:auto;transform:none}
#totop svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

@media(max-width:960px){
  .hero,.phero .in,.split{grid-template-columns:1fr}
  .hero-t{padding:40px 24px}
  .g3{grid-template-columns:repeat(2,1fr)}
  .dl{display:none}
}
@media(max-width:720px){
  .burger{display:grid}
  nav.main{display:none;position:absolute;top:66px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0;padding:6px 24px 14px}
  nav.main.open{display:flex}
  .nl{text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
  .nl[aria-current="page"]::after{display:none}
  .nl[aria-current="page"]{color:var(--red)}
  .cta.hd{display:none}
  .g3,.g2{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  .logo b{font-size:1.4rem}
}
</style>
</head>
<body>
<div id="progress"></div>

<header class="top">
  <div class="wrap top-in">
    <button class="logo" id="logo" aria-label="Weazel News — на главную"><b>Weazel</b><i>News</i></button>
    <nav class="main" id="nav" aria-label="Страницы"></nav>
    <div class="right">
      <button class="ibtn" id="theme" aria-label="Сменить тему"></button>
      <button class="cta hd" data-go="contact"><span class="d"></span>Связаться с нами</button>
      <button class="ibtn burger" id="burger" aria-label="Меню"><svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
    </div>
  </div>
</header>

<div class="ticker">
  <div class="tl">Срочно</div>
  <div class="tv"><div class="tt" id="tt"></div></div>
  <div class="dl mono" id="dl"></div>
</div>

<main id="app"></main>

<footer>
  <div class="wrap f-in">
    <button class="logo" data-go="home"><b>Weazel</b><i>News</i></button>
    <div class="f-links" id="flinks"></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
      <a class="f-mail" href="mailto:mercantile1038@gmail.com">mercantile1038@gmail.com</a>
      <span class="f-copy">© 2026 Weazel News. Все права защищены.</span>
    </div>
  </div>
</footer>

<button id="totop" aria-label="Наверх"><svg viewBox="0 0 20 20"><path d="M5 12l5-5 5 5"/></svg></button>

<script>
/* ================= ДАННЫЕ (из вашего сайта) ================= */
const IMG = {

const SERVICES = [

  {tag:'Съёмка', title:'Фото и видео'}

const PRICES = [
  {title:'Печать и реклама', lines:['Визитки (1 шт.) — 25$','Буклеты (10 шт.) — 400$','Журнал (1 шт.) — от 1000$','Меню (20 шт.) — 500$','Размещение рекламы в газете — 800$','Размещение рекламы на портале штата — 1500$']},
  {title:'Фото и видео', lines:['Фотосессия одиночная (до 10 фото) — 1500$','Фотосессия парная (до 10 фото) — 2000$','Обработка одного фото — 150$','Рекламные ролики/клипы (до 3 мин) — от 3500$','Монтаж видео — от 1500$']},

];
const TEAM = [
  {name:'Molly Mercantile', role:'Главный редактор', text:'Отвечает за выпуск новостей и рекламные заказы. Пишите ей по любым вопросам сотрудничества.', phone:'370-1077', img:null},
  {name:'Ify Jelani', role:'Репортёр и фотограф', text:'Ведёт съёмки, репортажи и интервью. Принимает заказы на фотосессии и видео.', phone:'872-8988', img:null}

function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const b=$('#theme');
  b.innerHTML = t==='dark'?ICON.sun:ICON.moon;
  b.title = t==='dark'?'Светлая тема':'Тёмная тема';
  b.setAttribute('aria-label', t==='dark'?'Включить светлую тему':'Включить тёмную тему');
  try{localStorage.setItem('visitor-theme',t)}catch(e){}
}
(function(){
  let t='dark';
  try{const s=localStorage.getItem('visitor-theme'); if(s==='light'||s==='dark') t=s;}catch(e){}
  setTheme(t);
})();
$('#theme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ================= РОУТЕР ================= */
function bind(){
  $$('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  $$('[data-copy]').forEach(el=>el.onclick=async()=>{
    try{await navigator.clipboard.writeText(el.dataset.copy);toast('Номер '+el.dataset.copy+' скопирован')}catch(e){toast('Номер: '+el.dataset.copy)}
  });
  const flt=$('#flt');
  if(flt){
    const info=$('#info');
    flt.onclick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      $$('button',flt).forEach(x=>x.setAttribute('aria-pressed',x===b));
      const f=b.dataset.f;
      $$('.pin').forEach(p=>{const bb=BB.find(x=>x.n==p.dataset.n);p.style.display=(f==='all'||bb.st===f)?'':'none'});
      $$('#bblist .bb').forEach(c=>c.style.display=(f==='all'||c.dataset.st===f)?'':'none');
      info.className='info hint'; info.textContent='Выберите точку на карте, чтобы увидеть подробности';
      $$('.pin').forEach(p=>p.classList.remove('on'));
    };
    $$('.pin').forEach(p=>p.onclick=()=>{
      const b=BB.find(x=>x.n==p.dataset.n);
      $$('.pin').forEach(x=>x.classList.toggle('on',x===p));
      info.className='info';
      info.innerHTML=`<div class="im"><img src="${b.img}" alt=""></div><div><span class="pill ${b.st}">${b.st==='free'?'Свободен':'Занят'}</span><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p></div>`;
    });
  }
}
function toast(msg){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.875rem;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3)';document.body.appendChild(t)}
  t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000);
}
function reveal(){
  if(!('IntersectionObserver' in window)) return;
  const els=$$('#app .news,#app .svc,#app .price,#app .bb,#app .team,#app .how,#app .cbox,#app .split');
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    e.target.classList.add('in'); io.unobserve(e.target);
    setTimeout(()=>{e.target.classList.remove('rv','in');e.target.style.transitionDelay=''},1000);
  }),{threshold:.08});
  els.forEach((el,i)=>{el.classList.add('rv');el.style.transitionDelay=(i%3)*90+'ms';io.observe(el)});
}
function render(){
  let id=(location.hash||'#home').slice(1);
  if(!views[id]) id='home';
  $('#app').innerHTML=views[id]();
  $$('.nl').forEach(b=>b.setAttribute('aria-current',b.dataset.go===id?'page':'false'));
  $('#nav').classList.remove('open');
  document.title=(PAGES.find(p=>p.id===id).title)+' — Weazel News';
  bind(); reveal();
}
function go(id){ if(location.hash==='#'+id){render()} else location.hash=id; window.scrollTo({top:0,behavior:'smooth'}); }
window.addEventListener('hashchange',render);

/* прогресс чтения и «наверх» */
function onScroll(){
  const h=document.documentElement,m=h.scrollHeight-h.clientHeight;
  $('#progress').style.width=(m>0?h.scrollTop/m*100:0)+'%';
  $('#totop').classList.toggle('show',window.scrollY>600);
}
window.addEventListener('scroll',onScroll,{passive:true});
$('#totop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

bind(); render(); onScroll();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weazel News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<!--
 ШПАРГАЛКА (Ctrl+F → «РЕДАКТИРУЙ» покажет все главные места):
 - Тексты, новости, цены, билборды, телефоны, картинки — блок «НАСТРОЙКИ И КОНТЕНТ» в <script> и функции VIEWS.
 - Цвета — строка :root в начале <style> (--red = главный красный).
 - Новая вкладка — подсказка над PAGES в <script>.
 - Файл должен называться index.html и лежать в корне репозитория GitHub.
-->
<style>
/* ЦВЕТА И РАЗМЕРЫ (РЕДАКТИРУЙ): --bg фон, --panel фон блоков, --line линии, --red главный красный, --red2 красный при наведении,
   --muted серый текст, --pad боковые отступы. Сайт занимает ВСЮ ширину экрана. Размер всего (шрифт, отступы, высота шапки)
   масштабируется вместе с экраном: см. html{font-size:clamp(мин, формула, макс)} — поменяйте 30px, если на огромных экранах нужно крупнее/мельче */
:root{--bg:#0a0a0d;--panel:#121216;--line:#25252c;--red:#d0141c;--red2:#e5222a;--text:#f4f4f6;--muted:#9a9aa6;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--pad:clamp(16px,3.4vw,96px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;font-size:clamp(14px,calc(10px + .5vw),30px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:1rem/1.6 'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(https://i.imgur.com/VL677mc.jpg) center/cover;opacity:.06}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px}
.wrap{width:100%;padding:0 var(--pad)}
.cap{font:500 .68rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ШАПКА: логотип, меню, кнопка «Прямой эфир» */
.top{background:#0b0b0e;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:center;gap:1.8rem;height:4.2rem}
.logo{display:flex;align-items:center;gap:.5rem;font:italic 800 2rem/1 'Onest',sans-serif;letter-spacing:-.04em;text-transform:uppercase}
.logo b{background:var(--red);padding:.2rem .6rem .2rem .45rem;font-size:1.65rem;transform:skewX(-8deg);display:inline-block}
.slogan{font:500 .58rem/1.5 var(--mono);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-left:.5rem}
nav{margin-left:auto;display:flex;gap:2rem;height:100%}
nav a{display:flex;align-items:center;font-size:.92rem;font-weight:500;color:#cfcfd6;border-bottom:2px solid transparent;margin-top:2px;transition:color .15s}
nav a:hover{color:#fff}
nav a.on{color:#fff;border-bottom-color:var(--red)}
.live{display:flex;align-items:center;gap:.6rem;background:var(--red);padding:.65rem 1.5rem;font-weight:600;font-size:.92rem;margin-left:.8rem}
.live:hover{background:var(--red2)}
.live i{width:.5rem;height:.5rem;border-radius:50%;background:#fff;animation:pl 1.5s infinite}
@keyframes pl{50%{opacity:.25}}

/* БЕГУЩАЯ СТРОКА «СРОЧНО». Скорость — число секунд в animation у .tt (меньше = быстрее) */
.tick{background:#0d0d11;border-bottom:1px solid var(--line);font-size:.84rem}
.tick .wrap{display:flex;align-items:center;gap:1.1rem;height:2.6rem}
.tick em{font:600 .68rem var(--mono);font-style:normal;letter-spacing:.14em;background:var(--red);padding:.3rem .9rem;flex:none}
.tv{overflow:hidden;flex:1;min-width:0;color:#c5c5cd}
.tt{display:flex;width:max-content;animation:mq 50s linear infinite}
.tv:hover .tt{animation-play-state:paused}
.tt span{white-space:nowrap;padding-right:2.5rem}
.tt span::after{content:"/";padding-left:2.5rem;color:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}
.tick .cap{flex:none}

/* ГЛАВНЫЙ ЭКРАН (на всех страницах): слева текст, справа большая картинка. Высота — min-height */
.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.4fr);border-bottom:1px solid var(--line);min-height:clamp(380px,62vh,900px)}
.hero-l{display:flex;flex-direction:column;justify-content:center;gap:1.4rem;padding:clamp(1.8rem,4vw,5rem) var(--pad)}
.hero h1{font-size:clamp(2rem,4.3vw,6rem);line-height:1.06;font-weight:700;letter-spacing:-.035em}
.hero p.sub{color:var(--muted);font-size:1.12rem;max-width:50ch}
.btns{display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.7rem;background:var(--red);padding:.9rem 1.7rem;font-weight:600;border:0;transition:background .15s}
.btn:hover{background:var(--red2)}
.lnk{font-weight:500;border-bottom:1px solid #fff;padding-bottom:3px}
.lnk:hover{color:var(--red2);border-color:var(--red2)}
.hero-r{position:relative;overflow:hidden;background:#15151a}
.hero-r img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero-r::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c 0,#0000 45%)}
.badge{position:absolute;top:1.1rem;left:1.4rem;z-index:2;background:var(--red);font:700 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:.45rem .9rem}
.hero-cap{position:absolute;left:2rem;bottom:1.6rem;z-index:2}
.hero-cap h3{font-size:1.5rem;font-weight:600}

/* БЛОКИ, ЗАГОЛОВКИ РАЗДЕЛОВ, КАРТОЧКИ НОВОСТЕЙ. Сетка сама выбирает число колонок под ширину экрана */
main{flex:1}
section.blk{padding:clamp(1.8rem,3.4vw,4rem) 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.5rem}
.sh h2{font-size:clamp(1.6rem,2.8vw,3rem);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.sh p{color:var(--muted);margin-top:.3rem}
.more{font-size:.86rem;border-bottom:1px solid var(--muted);padding-bottom:2px;color:#ddd}
.grid{display:grid;gap:clamp(1rem,2vw,2.4rem);grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.card{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.card .im{aspect-ratio:16/9;background:linear-gradient(135deg,#1a1a20,#101014);border:1px solid var(--line);overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .im img{transform:scale(1.04)}
.tag{font:700 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red2);margin-top:.5rem}
.tag.free{color:#4cc16a}.tag.busy{color:#ff5b5b}
.card h3{font-size:1.2rem;font-weight:600;line-height:1.35}
.card p{color:var(--muted);font-size:.96rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,3vw,4rem);align-items:center}
.split .im{aspect-ratio:4/3;border:1px solid var(--line);overflow:hidden;background:var(--panel)}
.split img{width:100%;height:100%;object-fit:cover}
.prose{max-width:70ch;color:#d4d4da}

/* СПИСОК СТРОК (главная «чем занимаемся», страница «Контакты»): слева подпись, справа крупный текст */
.dir{border-top:1px solid var(--line)}
.dr{display:grid;grid-template-columns:minmax(7rem,16%) 1fr;gap:.8rem 2rem;align-items:baseline;padding:clamp(1.1rem,2.2vw,2.2rem) 0;border-bottom:1px solid var(--line)}
.dr b{font-size:clamp(1.4rem,2.8vw,3.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.dr b small{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:.5rem}
.dr a:hover{color:var(--red2)}

/* СТРАНИЦА «БИЛБОРДЫ»: полоса цифр, карта, список строк со статусом */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats>div{padding:clamp(1rem,2.2vw,2.2rem) var(--pad);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.3rem}
.stats>div:last-child{border:0}
.stats b{font-size:clamp(2.2rem,5vw,6rem);line-height:1;letter-spacing:-.045em}
.stats .g{color:#4cc16a}.stats .r{color:var(--red2)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:clamp(4rem,8vw,8rem) minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:.6rem 2rem;align-items:center;padding:1.1rem 0;border-bottom:1px solid var(--line);transition:background .15s}
.row:hover{background:#ffffff08}
.row .n{font:700 clamp(1.4rem,2.4vw,2.8rem)/1 var(--mono);color:var(--red2)}
.row h3{font-size:1.2rem;font-weight:600;line-height:1.3}
.row p{color:var(--muted);font-size:.96rem}
.pill{font:700 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:.45rem .95rem;background:#2f9e4a;white-space:nowrap}
.pill.busy{background:var(--red)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.seg{display:flex;border:1px solid var(--line)}
.seg button{background:none;border:0;padding:.6rem 1.2rem;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--red);color:#fff}
.map{position:relative;border:1px solid var(--line);background:#16161b;user-select:none}
.map>img{width:100%;height:auto;display:block}
.mapempty{aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted)}
.pin{position:absolute;transform:translate(-50%,-50%);width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid #fff;color:#fff;font:700 .7rem var(--mono);display:grid;place-items:center;padding:0;box-shadow:0 3px 10px #000a}
.pin.free{background:#2f9e4a}.pin.busy{background:#c0392b}
.pin.on{transform:translate(-50%,-50%) scale(1.45);z-index:3;box-shadow:0 0 0 4px #fff6}
.info{display:grid;grid-template-columns:14rem 1fr;gap:1.4rem;align-items:center;margin-top:1rem;padding:1rem;border:1px solid var(--line);background:var(--panel)}
.info.h{display:block;text-align:center;color:var(--muted);border-style:dashed}
.info .im{aspect-ratio:16/10;overflow:hidden}.info img{width:100%;height:100%;object-fit:cover}
.cal{border:1px dashed var(--red);padding:.9rem;margin-bottom:1rem;font-size:.9rem;display:flex;flex-direction:column;gap:.6rem;background:#d0141c14}
.cal select{background:var(--bg);color:#fff;border:1px solid var(--line);padding:.5rem}

/* СТРАНИЦА «ЦЕНЫ И УСЛУГИ»: прайс на всю ширину, колонки разделены линиями, цена справа через точки */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));border-top:3px solid var(--red)}
.col{padding:clamp(1.4rem,2.8vw,3rem) var(--pad);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.col h2{font-size:clamp(1.5rem,2.4vw,2.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:1rem}
.pl{list-style:none;padding:0}
.pl li{display:flex;align-items:baseline;gap:.7rem;padding:.8rem 0;line-height:1.35}
.pl li i{flex:1;min-width:1rem;border-bottom:1px dotted #4a4a55;transform:translateY(-.25em)}
.pl b{font:700 1.1rem var(--mono);color:var(--red2);white-space:nowrap}
.pl li.n{display:block;color:var(--muted);font-size:.8rem;padding:.2rem 0 .8rem}

/* КОМАНДА (страница «Контакты») */
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));border-top:1px solid var(--line)}
.tp{display:grid;grid-template-columns:clamp(5.5rem,11vw,12rem) 1fr;gap:1.4rem;padding:1.6rem var(--pad) 1.6rem 0;border-bottom:1px solid var(--line)}
.av{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);display:grid;place-items:center;font:800 clamp(2rem,4vw,5rem) 'Onest',sans-serif;color:var(--red2);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.tp h3{font-size:clamp(1.3rem,2vw,2.2rem);letter-spacing:-.02em;line-height:1.2;margin:.2rem 0 .5rem}
.tp p{color:var(--muted)}
.ph{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:1rem;font:500 1rem var(--mono)}
.ph button{background:none;border:1px solid var(--line);padding:.25rem .7rem;font-size:.75rem;color:var(--muted)}
.ph button:hover{border-color:var(--muted);color:#fff}

/* ПОДВАЛ */
footer{border-top:1px solid var(--line);margin-top:2rem;background:#0b0b0e}
footer .wrap{display:flex;align-items:center;gap:1.6rem;min-height:5.2rem;flex-wrap:wrap;padding-top:1rem;padding-bottom:1rem}
footer .logo{font-size:1.4rem}footer .logo b{font-size:1.15rem}
footer small{font:400 .66rem var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
footer nav{height:auto;gap:1.4rem}
footer nav a{font-size:.8rem;border:0;margin:0;color:#c5c5cd}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#000;padding:.6rem 1rem;font-size:.9rem;z-index:99}

/* АДАПТИВ: планшеты (до 960px) и телефоны (до 640px) */
@media(max-width:960px){
 .slogan,.tick .cap{display:none}
 .top .wrap{flex-wrap:wrap;height:auto;padding-top:.7rem;padding-bottom:.4rem;gap:.6rem 1rem}
 nav{order:3;width:100%;margin:0;overflow-x:auto;gap:1.5rem;height:2.7rem}
 .live{margin-left:auto;padding:.5rem 1rem}
 .hero,.split{grid-template-columns:1fr}
 .hero-r{min-height:18rem}
 .row{grid-template-columns:3.6rem 1fr auto}
 .row p{grid-column:1/-1}
}
@media(max-width:640px){
 .info,.dr,.stats{grid-template-columns:1fr}
 .stats>div{border-right:0;border-bottom:1px solid var(--line)}
 .sh{flex-direction:column;align-items:flex-start}
 .tp{grid-template-columns:5rem 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ШАПКА: логотип, слоган, меню (строится из PAGES), кнопка «Прямой эфир» (ссылка — CFG.liveUrl) -->
<header class="top"><div class="wrap">
  <a class="logo" href="#/home" aria-label="Weazel News">Weazel <b>News</b></a>
  <span class="slogan">Правда<br>движет<br>Лос-Сантосом</span>
  <nav id="nav" aria-label="Страницы"></nav>
  <a class="live" id="live" href="#/contacts"><i></i>Прямой эфир</a>
</div></header>

<!-- БЕГУЩАЯ СТРОКА: текст берётся из заголовков новостей (NEWS) -->
<div class="tick"><div class="wrap">
  <em>Срочно</em>
  <div class="tv"><div class="tt" id="tt"></div></div>
  <span class="cap">Лос-Сантос / Ваш город / Наши новости</span>
</div></div>

<!-- СЮДА скрипт подставляет выбранную вкладку (см. VIEWS) -->
<main id="app"></main>

<!-- ПОДВАЛ: тексты из CFG.copy и CFG.email -->
<footer><div class="wrap">
  <a class="logo" href="#/home">Weazel <b>News</b></a>
  <small id="copy"></small>
  <nav id="fnav" style="margin-left:auto"></nav>
  <small id="mail"></small>
</div></footer>

<script>
/* =====================  НАСТРОЙКИ И КОНТЕНТ — правьте здесь (РЕДАКТИРУЙ)  =====================
   Текст пишите внутри кавычек '...'. Если внутри нужна кавычка ' — ставьте перед ней \ .
   Запятые между пунктами списков не удаляйте. После правки сохраните файл и обновите страницу. */
/* IMG('abc123') превращает код картинки imgur в ссылку. Можно писать и полную ссылку 'https://...jpg' */
const IMG = id => 'https://i.imgur.com/' + id + '.jpg';
const CFG = {
  email: 'mercantile1038@gmail.com',
  copy: '© 2026 Weazel News. Все права защищены.',
  liveUrl: '',                       // ссылка на прямой эфир; пусто = кнопка ведёт на «Контакты»
  heroImg: IMG('i2kWNP9'),           // картинка на главной
  billImg: IMG('i2kWNP9'),           // картинка в шапке страницы «Билборды»
  priceImg: IMG('i2kWNP9'),          // картинка в шапке страницы «Цены и услуги»
  contactImg: IMG('i2kWNP9'),        // картинка в шапке страницы «Контакты»
  mapImg: IMG('RWH8fDt'),            // карта города для билбордов
};
/* ТОЧКИ НА КАРТЕ: номер билборда: [отступ слева %, отступ сверху %]. Режим разметки: открыть сайт с ?calibrate в конце адреса */
const BB_POS = { 1:[38.4,29.1], 2:[52.0,41.7], 3:[14.5,33.2] };

/* НОВОСТИ (главная + бегущая строка). Новая новость = скопируйте блок { ... } и вставьте через запятую.
   tag — красная метка, title — заголовок, text — описание, img — картинка */
const NEWS = [
  { tag:'Новости', title:'Главные события дня', img:IMG('QbtGLMP'),
    text:'Граждане рабочих мест нашего города собрались для митинга с целью выдвинуть свои требования.' },
  { tag:'Похороны', title:'Что происходит в городе', img:IMG('yA1rHvK'),
    text:'Последний путь Ханны Юн.' },
  { tag:'Помощник Губернатора', title:'Новое расследование Weazel News', img:IMG('R6CoRVc'),
    text:'Офицеры в то же время начали ограничивать действия жителей Los-Santos, остающихся на месте происшествия — неоднократно предлагая тем забрать свои транспортные средства и покинуть территорию.' },
];
/* «ЧЕМ МЫ ЗАНИМАЕМСЯ» на главной: ['метка', 'название'] */
const WORK = [['Дизайн','Дизайн и Текст'],['Разработка','Печать и Реклама'],['Съёмка','Фото и видео']];

/* БИЛБОРДЫ. Одна строка = один билборд: [номер, улица, код, статус, описание]. Статус: 1 — свободен, 0 — занят.
   D и P — сокращения: D = стандартное описание, P = 'Шоссе Дель-Перро'. Вместо них можно писать свой текст. */
const D = 'Отличная видимость с основной магистрали города.', P = 'Шоссе Дель-Перро';
const BB = [
  [1,'Вайнвуд Бульвар',8177,0,'Высокий пешеходный и автомобильный трафик.'],
  [2,P,7105,0,D],[3,'Веспуччи Бич',7326,0,'Зона отдыха и высокой активности в течение всего дня.'],
  [4,P,8182,1,D],[5,P,9248,1,D],[6,P,9035,1,D],[7,P,9061,1,D],[8,P,9052,1,D],[9,P,9187,1,D],
  [10,P,9162,0,D],[11,P,7205,1,D],[12,P,7079,0,D],[13,P,9000,0,D],[14,P,3036,1,D],
  [15,P,3045,0,D],[16,P,2048,0,D],[17,P,3035,1,D],[18,P,3036,0,D],[19,P,3030,1,D],
].map(([n,s,c,f,t]) => ({ n, s, c, title:`Билборд №${n} — ${s} [${c}]`, free:!!f, text:t, img:IMG('jXQsUD3') }));
const FREE = BB.filter(b => b.free).length;

/* ЦЕНЫ. Три колонки: ['Название', 'строка — цена\nстрока — цена']. Формат строки: «Услуга — цена» (тире с пробелами!).

const $ = s => document.querySelector(s);
const img = (src, alt='') => src ? `<img src="${src}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
const ml = t => t.split('\n').filter(Boolean);
const tel = p => 'tel:' + p.replace(/[^\d+]/g, '');

function newsCard(n){
  return `<article class="card"><div class="im">${img(n.img, n.title)}</div>
    <div class="tag">${n.tag}</div><h3>${n.title}</h3><p>${n.text}</p></article>`;
}
// Шапка страницы: head(заголовок, текст, кнопка, картинка, надпись над заголовком, метка на фото)
function head(t, text, btn, image, eyebrow, badge){
  return `<section class="hero"><div class="hero-l"><span class="cap">${eyebrow||'Weazel News'}</span><h1>${t}</h1>
    ${text?`<p class="sub">${text}</p>`:''}${btn?`<div class="btns">${btn}</div>`:''}</div>
    <div class="hero-r">${img(image,t)}<span class="badge">${badge||'В фокусе'}</span></div></section>`;
}
// Строка билборда в списке
function bbRow(b){
  return `<div class="row"><span class="n">№${b.n}</span><div><h3>${b.s} <span class="cap">[${b.c}]</span></h3></div><p>${b.text}</p>
    <span class="pill ${b.free?'':'busy'}">${b.free?'Свободен':'Занят'}</span></div>`;
}

/* Карта билбордов: фильтры, точки, карточка выбранного билборда, режим разметки ?calibrate */
function initMap(){
  const box = $('#mapbox'); if(!box) return;
  const cal = /[?&]calibrate/.test(location.search);
  let filter = 'all', sel = null, cur = '', pos = {...BB_POS};
  const draw = () => {
    const list = BB.filter(b => filter==='all' || (filter==='free')===b.free);
    const a = BB.find(b=>b.n===sel);
    box.innerHTML = `
      <div class="sh"><div><h2>Карта билбордов</h2><p>Нажмите на точку, чтобы увидеть адрес и статус</p></div></div>
      <div class="bar"><div class="seg">${[['all','Все',BB.length],['free','Свободные',FREE],['busy','Занятые',BB.length-FREE]]
        .map(([k,t,n])=>`<button aria-pressed="${filter===k}" data-f="${k}">${t} · ${n}</button>`).join('')}</div>
        <span class="cap">${FREE} из ${BB.length} свободно</span></div>
      ${cal?`<div class="cal"><b>Режим разметки</b><span>Выберите билборд, затем кликните на карте — он встанет на место. Потом скопируйте координаты и вставьте в BB_POS.</span>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap"><select id="cs"><option value="">— билборд —</option>${BB.map(b=>`<option value="${b.n}" ${String(b.n)===cur?'selected':''}>${pos[b.n]?'✓ ':''}${b.title}</option>`).join('')}</select>
        <button class="btn" id="ce" style="padding:.5rem 1rem">Скопировать (${Object.keys(pos).length}/${BB.length})</button></div></div>`:''}
      <div class="map" id="map" ${cal&&cur?'style="cursor:crosshair"':''}>
        ${CFG.mapImg?img(CFG.mapImg,'Карта билбордов'):'<div class="mapempty">Укажите ссылку на карту в CFG.mapImg</div>'}
        ${list.filter(b=>pos[b.n]).map(b=>`<button class="pin ${b.free?'free':'busy'} ${sel===b.n?'on':''}" style="left:${pos[b.n][0]}%;top:${pos[b.n][1]}%" data-n="${b.n}" aria-label="${b.title}">${b.n}</button>`).join('')}
      </div>
      ${a?`<div class="info"><div class="im">${img(a.img,a.title)}</div><div><div class="tag ${a.free?'free':'busy'}" style="margin:0">${a.free?'Свободен':'Занят'}</div><h3 style="margin:.4rem 0">${a.title}</h3><p style="color:var(--muted)">${a.text}</p></div></div>`
        :'<div class="info h">Выберите точку на карте, чтобы увидеть подробности</div>'}`;
    box.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;sel=null;draw()});
    box.querySelectorAll('.pin').forEach(p=>p.onclick=e=>{e.stopPropagation();sel=+p.dataset.n;draw()});
    if(cal){
      $('#cs').onchange=e=>{cur=e.target.value;draw()};
      $('#ce').onclick=()=>{const t='const BB_POS = {\n'+Object.entries(pos).sort((x,y)=>x[0]-y[0]).map(([k,v])=>`  ${k}:[${v}],`).join('\n')+'\n};';
        navigator.clipboard?.writeText(t).then(()=>toast('Координаты скопированы'),()=>prompt('Скопируйте:',t))};
      $('#map').onclick=e=>{ if(!cur) return; const r=e.currentTarget.getBoundingClientRect();
        pos[cur]=[+((e.clientX-r.left)/r.width*100).toFixed(1),+((e.clientY-r.top)/r.height*100).toFixed(1)];
        const i=BB.findIndex(b=>String(b.n)===cur); cur=BB[i+1]?String(BB[i+1].n):''; draw(); };
    }
  };
  draw();
}

/* Переключение вкладок по адресу #/название. Работает без сервера, поэтому подходит для GitHub Pages */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
function route(){
  const id = (location.hash.match(/^#\/(\w+)/)||[])[1];
  const cur = PAGES.some(p=>p[0]===id) ? id : 'home';
  $('#app').innerHTML = VIEWS[cur]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===cur));
  document.title = (cur==='home' ? '' : PAGES.find(p=>p[0]===cur)[1]+' — ') + 'Weazel News';
  if(cur==='billboards') initMap();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-scroll]'); if(s){e.preventDefault();document.getElementById(s.dataset.scroll)?.scrollIntoView()}
  const c=e.target.closest('[data-copy]'); if(c) navigator.clipboard?.writeText(c.dataset.copy).then(()=>toast('Номер '+c.dataset.copy+' скопирован'),()=>toast('Номер: '+c.dataset.copy));
});

$('#nav').innerHTML = PAGES.map(([id,t])=>`<a href="#/${id}" data-p="${id}">${t}</a>`).join('');
$('#fnav').innerHTML = PAGES.map(([id,t])=>`<a href="#/${id}">${t}</a>`).join('');
$('#copy').textContent = CFG.copy;
$('#mail').textContent = CFG.email;
if(CFG.liveUrl){const l=$('#live');l.href=CFG.liveUrl;l.target='_blank';l.rel='noopener'}
const heads = NEWS.map(n=>n.title).concat(['Weazel News — главные события Лос-Сантоса в прямом эфире']);
$('#tt').innerHTML = [...heads,...heads].map(t=>`<span>${t}</span>`).join('');
addEventListener('hashchange',route);
route();
</script>
